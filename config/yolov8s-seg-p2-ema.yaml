# YOLOv8s-seg + P2 小目标头 + C2f-EMA 注意力（可选消融模型）
# 在 config/yolov8s-seg-p2.yaml 基础上，将全部 C2f 替换为 C2f_EMA
# （EMA 高效多尺度注意力，arXiv:2305.13563），验证 EMA 是否在 P2 基础上继续带来收益。
# 训练超参（imgsz=640 等）由训练脚本统一指定，与基线/P2 一致以保证可比。

# Parameters
nc: 6 # CarDD 类别数（dent/scratch/crack/glass shatter/lamp broken/tire flat）
scale: s # 与基线/P2 同尺寸 [depth, width, max_channels] = [0.33, 0.50, 1024]
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# Backbone（C2f → C2f_EMA）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f_EMA, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f_EMA, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f_EMA, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f_EMA, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

# Head（含 P2/4 分支，C2f → C2f_EMA）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f_EMA, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f_EMA, [256]] # 15 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 3, C2f_EMA, [128]] # 18 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]] # cat head P3
  - [-1, 3, C2f_EMA, [256]] # 21 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f_EMA, [512]] # 24 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f_EMA, [1024]] # 27 (P5/32-large)

  - [[18, 21, 24, 27], 1, Segment, [nc, 32, 256]] # Segment(P2, P3, P4, P5)
