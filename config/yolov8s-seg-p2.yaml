# YOLOv8s-seg + P2 小目标分割头（改进模型，stride=4 高分辨率检测层）
# 与基线差异：backbone 保持原样，head 在 P3 之下新增 P2/4 分支，
# Segment 输出变为 (P2, P3, P4, P5) 四个检测层，用于提升 crack/scratch 等小目标识别。
# 训练超参（imgsz=640 等）由训练脚本统一指定，与基线一致以保证可比。

# Parameters
nc: 6 # CarDD 类别数（dent/scratch/crack/glass shatter/lamp broken/tire flat）
scale: s # 固定 s 尺寸，与基线 yolov8s-seg 的 [depth, width, max_channels] = [0.33, 0.50, 1024] 完全一致
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# Backbone（与基线完全一致）
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

# Head（新增 P2/4 分支）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 3, C2f, [128]] # 18 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]] # cat head P3
  - [-1, 3, C2f, [256]] # 21 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 24 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, C2f, [1024]] # 27 (P5/32-large)

  - [[18, 21, 24, 27], 1, Segment, [nc, 32, 256, 0]] # Segment(P2, P3, P4, P5)；末位 0 表示 mask 原型由 P2(strides=4) 生成，输出 320×320（imgsz/2），
                                                   # 与训练/验证时下采样到 imgsz/2 的真值掩膜一致，使高分辨率特征进入掩膜分支
